<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin Duy Khanh Booker</title><link rel="stylesheet" href="style.css"></head><body><div class="wrap">
<div id="lg" style="max-width:360px;margin:15vh auto"><h2>Đăng nhập admin</h2><p class="err" id="le"></p><button class="btn" id="gb">Đăng nhập bằng Google</button></div>
<div id="app" hidden><div class="nav"><b class="brand">Admin</b><span class="tabs"><button data-t="s" class="on">Giới thiệu</button><button data-t="f">Tàu</button><button data-t="c">Xe</button><button data-t="b">Đơn đặt</button><button id="out">Thoát</button></span></div>
<section id="p-s"><div class="box"><label>Tên thương hiệu<input id="s_brand"></label><label>SĐT / Zalo<input id="s_phone"></label><label>Link Facebook<input id="s_fb" placeholder="https://facebook.com/..."></label><label>Link Instagram<input id="s_ig" placeholder="https://instagram.com/..."></label><label>Nội dung Chính sách bảo mật (khách bấm link trong form sẽ thấy; để trống = dùng mẫu có sẵn)<textarea id="s_privacy" rows="7"></textarea></label>
<label>Giới thiệu<textarea id="s_intro" rows="4"></textarea></label><label>Kinh nghiệm<textarea id="s_exp" rows="3"></textarea></label>
<label>Khách hàng (mỗi dòng một khách)<textarea id="s_customers" rows="3"></textarea></label><label>Tiêu đề trang Thông tin xe<input id="s_fleetTitle" placeholder="Những xe mình cho thuê"></label>
<label>Loại phòng (mỗi dòng một loại)<textarea id="s_roomTypes" rows="3" placeholder="Phòng đôi"></textarea></label><label>Vị trí phòng (mỗi dòng một loại)<textarea id="s_roomLocs" rows="2" placeholder="Trung tâm"></textarea></label>
<label>Link ảnh đại diện (vd: img/avatar.jpg)<input id="s_av"></label><img id="s_pv" style="max-width:120px;display:block;margin-bottom:12px">
<button class="btn" id="s_save">Lưu</button> <span id="s_m" class="ok"></span></div></section>
<section id="p-f" hidden><div class="box"><h3 id="f_h">Thêm tàu</h3>
<div class="row"><label>Tên tàu<input id="f_name"></label><label>Thứ tự (số nhỏ hiện trước)<input id="f_order" type="number" value="0"></label></div>
<label>Thông tin chi tiết (giờ chạy, tiện ích, hạng ghế...)<textarea id="f_info" rows="4"></textarea></label>
<label>Link ảnh tàu (vd: img/superdong.jpg)<input id="f_img"></label>
<b>Bảng giá vé</b> <span class="mut">(ô nào không áp dụng thì để trống; có thể gõ chữ như "800K (Thương gia)")</span><div id="f_rows"></div>
<button class="btn g" id="f_add">+ Thêm dòng giá</button><br><br>
<button class="btn" id="f_save">Lưu tàu</button> <button class="btn g" id="f_new">Làm mới</button></div>
<div id="f_list"></div>
<div class="box"><label>Lưu ý chung cho khách (hiện cuối trang Thông tin tàu)<textarea id="f_note" rows="6"></textarea></label><button class="btn" id="f_nsave">Lưu lưu ý</button> <span class="ok" id="f_nm"></span></div>
<div class="box"><button class="btn g" id="f_seed">Nhập sẵn 4 tàu theo bảng giá</button></div></section>
<section id="p-c" hidden><div class="box"><h3 id="c_h">Thêm xe</h3><div class="row"><label>Tên xe<input id="c_name"></label><label>Hạng mục (vd: Xe số, Xe ga, 4 chỗ)<input id="c_cat"></label></div>
<div class="row"><label>Giá (nhập tự do, vd 150.000đ/ngày)<input id="c_price"></label><label>Thông số ngắn<input id="c_spec" placeholder="Số tự động · 110cc · 2 người"></label></div>
<label>Mô tả / điều kiện thuê<textarea id="c_desc" rows="4"></textarea></label><div class="row"><label>Thứ tự (số nhỏ hiện trước)<input id="c_order" type="number" value="0"></label>
<label><input type="checkbox" id="c_pin" style="width:auto"> Hiện ở mục "Tất cả" (tối đa 4)</label></div>
<label>Link ảnh xe (vd: img/xe1.jpg)<input id="c_img"></label><img id="c_pv" style="max-width:160px;display:block;margin-bottom:12px">
<button class="btn" id="c_save">Lưu xe</button> <button class="btn g" id="c_new">Làm mới</button></div><div id="c_list"></div></section>
<section id="p-b" hidden><div id="b_list"></div></section></div></div>
<script type="module">
import {auth,db,ADMIN_EMAIL} from './firebase-config.js';
import {GoogleAuthProvider,signInWithPopup,signOut,onAuthStateChanged} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
import {doc,getDoc,setDoc,collection,getDocs,addDoc,updateDoc,deleteDoc,query,orderBy} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';
addEventListener('unhandledrejection',e=>{const c=(e.reason&&e.reason.code)||'';alert('Không lưu được'+(c?': '+c:'')+(c==='permission-denied'?'\nRules Firebase chưa cho phép thao tác này. Hãy thêm mục ferries vào Rules (file firestore.rules) rồi bấm Publish.':''))});
const $=i=>document.getElementById(i),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const U=(v,old)=>v.trim()||(old&&old.startsWith('data:')?old:''),pv=(i,p)=>{const v=$(i).value.trim();$(p).src=v;$(p).hidden=!v};
const AE=(ADMIN_EMAIL||'').trim().toLowerCase(),L=t=>{$('le').className='err';$('le').textContent=t};
$('gb').onclick=async()=>{try{await signInWithPopup(auth,new GoogleAuthProvider())}catch(x){L(x.code==='auth/popup-blocked'?'Trình duyệt chặn cửa sổ đăng nhập, hãy cho phép popup rồi thử lại.':x.code==='auth/unauthorized-domain'?'Chưa thêm domain github.io vào Authorized domains của Firebase.':'Đăng nhập không thành công: '+x.code)}};
$('out').onclick=()=>signOut(auth);
onAuthStateChanged(auth,u=>{if(u&&(u.email||'').toLowerCase()!==AE){signOut(auth);L('Tài khoản Google này không có quyền admin.');return}$('lg').hidden=!!u;$('app').hidden=!u;if(u){loadS();loadF();loadC();loadB()}});
document.querySelector('.tabs').onclick=e=>{const t=e.target.dataset.t;if(!t)return;
 document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b===e.target));
 ['s','f','c','b'].forEach(k=>$('p-'+k).hidden=k!==t)};
/* Giới thiệu */
const K=['brand','phone','intro','exp','customers','fleetTitle','roomTypes','roomLocs','fb','ig','privacy'];let av='';
async function loadS(){const d=(await getDoc(doc(db,'settings','site'))).data()||{};K.forEach(k=>$('s_'+k).value=d[k]||'');av=d.avatar||'';$('f_note').value=d.ferryNote||'';$('s_av').value=av.startsWith('data:')?'':av;pv('s_av','s_pv');if(av.startsWith('data:')){$('s_pv').src=av;$('s_pv').hidden=false}}
$('s_av').oninput=()=>pv('s_av','s_pv');
$('s_save').onclick=async()=>{const d={avatar:U($('s_av').value,av)};K.forEach(k=>d[k]=$('s_'+k).value);await setDoc(doc(db,'settings','site'),d,{merge:true});$('s_m').textContent='Đã lưu';setTimeout(()=>$('s_m').textContent='',2000)};
/* Tàu */
const PK=[['type','Loại vé (Ghế ngồi...)'],['adult','Người lớn'],['local','Người địa phương'],['senior','Cao tuổi (60+)'],['disabled','Khuyết tật'],['child','Trẻ em 6-11']];
let fer=[],fid=null,rows=[];
const blank=()=>({type:'',adult:'',local:'',senior:'',disabled:'',child:''});
function rr(){$('f_rows').innerHTML=rows.map((r,i)=>`<div class="box"><div class="row">${PK.map(([k,p])=>`<input data-i="${i}" data-k="${k}" placeholder="${p}" value="${esc(r[k])}">`).join('')}</div><button class="btn g" data-rd="${i}">Xóa dòng</button></div>`).join('')}
function fres(){fid=null;rows=[blank()];['name','info','img'].forEach(k=>$('f_'+k).value='');$('f_order').value=0;$('f_h').textContent='Thêm tàu';rr()}
async function loadF(){fer=(await getDocs(collection(db,'ferries'))).docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(a.order||0)-(b.order||0));
 $('f_list').innerHTML=fer.map(f=>`<div class="box"><b>${esc(f.name)}</b> <span class="mut">· ${(f.prices||[]).length} dòng giá</span><br><button class="btn g" data-fe="${f.id}">Sửa</button> <button class="btn g" data-fd="${f.id}">Xóa</button></div>`).join('')||'<p class="mut">Chưa có tàu.</p>'}
$('f_rows').oninput=e=>{const{i,k}=e.target.dataset;if(k)rows[i][k]=e.target.value};
$('f_rows').onclick=e=>{const i=e.target.dataset.rd;if(i!==undefined){rows.splice(+i,1);if(!rows.length)rows=[blank()];rr()}};
$('f_add').onclick=()=>{rows.push(blank());rr()};$('f_new').onclick=fres;fres();
$('f_save').onclick=async()=>{if(!$('f_name').value.trim())return alert('Nhập tên tàu');
 const d={name:$('f_name').value.trim(),info:$('f_info').value,img:$('f_img').value.trim(),order:+$('f_order').value||0,prices:rows.filter(r=>PK.some(([k])=>String(r[k]).trim()))};
 fid?await updateDoc(doc(db,'ferries',fid),d):await addDoc(collection(db,'ferries'),d);fres();loadF()};
$('f_list').onclick=async e=>{const E=e.target.dataset.fe,D=e.target.dataset.fd;
 if(E){const f=fer.find(x=>x.id===E);fid=E;$('f_name').value=f.name||'';$('f_info').value=f.info||'';$('f_img').value=f.img||'';$('f_order').value=f.order||0;rows=(f.prices||[]).map(r=>({...blank(),...r}));if(!rows.length)rows=[blank()];$('f_h').textContent='Sửa tàu';rr();scrollTo(0,0)}
 if(D&&confirm('Xóa tàu này?')){await deleteDoc(doc(db,'ferries',D));loadF()}};
$('f_nsave').onclick=async()=>{await setDoc(doc(db,'settings','site'),{ferryNote:$('f_note').value},{merge:true});$('f_nm').textContent='Đã lưu';setTimeout(()=>$('f_nm').textContent='',2000)};
const P=(t,a,l,s,d,c)=>({type:t,adult:a,local:l,senior:s,disabled:d,child:c});
$('f_seed').onclick=async()=>{if(!confirm('Nhập sẵn 4 tàu theo bảng giá? Chỉ nên làm khi chưa có tàu nào.'))return;
 const L=[['SUPERDONG 1 / SUPERDONG 2',[P('Ghế ngồi','344K','','290K','256K','246K'),P('Ghế nằm (SPD 2)','393K','','393K','393K','393K')]],
 ['TRƯNG TRẮC (Phú Quốc Express)',[P('Ghế ngồi','370K','350K','295K','260K','275K'),P('Ghế VIP','450K','450K','450K','450K','450K')]],
 ['PHÚ QUÝ EXPRESS',[P('Ghế ngồi','345K','','295K','295K','245K'),P('Giường','395K','','345K','295K','345K')]],
 ['CHAN KHA LUXURY',[P('Ghế ngồi','370K','350K','290K','800K (Thương gia)','250K'),P('Ghế VIP','480K','480K','480K','800K (Thương gia)','480K')]]];
 for(let i=0;i<L.length;i++)await addDoc(collection(db,'ferries'),{name:L[i][0],info:'',img:'',order:i+1,prices:L[i][1]});
 if(!$('f_note').value.trim()){const n=['• Quý khách vui lòng gửi ảnh mặt trước CCCD (1 CCCD chỉ xuất được 1 vé) và 1 số điện thoại người đại diện; trường hợp có người nước ngoài thì cung cấp passport.','• Mang theo CCCD (passport/hộ chiếu, visa bản gốc và còn hạn đối với khách nước ngoài) khi xuống tàu.','• Tàu hủy chuyến, đổi giờ quý khách sẽ được dời ngày, đổi giờ hoặc hoàn 100% tiền vé. Nếu khứ hồi cùng một tàu sẽ được hoàn cả 2 chuyến.','• Vui lòng có mặt trước bến tàu 30–45 phút trước giờ khởi hành.','• Tàu chạy khoảng 2 giờ 15 phút đến 2 giờ 30 phút, có trường hợp 2 giờ 45 phút tùy thời tiết.'].join('\n');
  $('f_note').value=n;await setDoc(doc(db,'settings','site'),{ferryNote:n},{merge:true})}
 loadF()};
/* Xe */
let cars=[],eid=null,img='';
const F=['name','cat','price','spec','desc','order'];
function reset(){eid=null;img='';F.forEach(k=>$('c_'+k).value=k==='order'?0:'');$('c_pin').checked=false;$('c_pv').hidden=true;$('c_h').textContent='Thêm xe';$('c_img').value=''}
async function loadC(){cars=(await getDocs(collection(db,'cars'))).docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(a.order||0)-(b.order||0));
 $('c_list').innerHTML=cars.map(c=>`<div class="box"><b>${esc(c.name)}</b> <span class="mut">· ${esc(c.category)} · ${esc(c.price)}${c.pinned?' · ★ Tất cả':''}</span><br>
 <button class="btn g" data-e="${c.id}">Sửa</button> <button class="btn g" data-d="${c.id}">Xóa</button></div>`).join('')}
$('c_img').oninput=()=>pv('c_img','c_pv');
$('c_new').onclick=reset;reset();
$('c_save').onclick=async()=>{if(!$('c_name').value.trim())return alert('Nhập tên xe');
 const d={name:$('c_name').value.trim(),category:$('c_cat').value.trim(),price:$('c_price').value,spec:$('c_spec').value,desc:$('c_desc').value,order:+$('c_order').value||0,pinned:$('c_pin').checked,img:U($('c_img').value,img)};
 eid?await updateDoc(doc(db,'cars',eid),d):await addDoc(collection(db,'cars'),d);reset();loadC()};
$('c_list').onclick=async e=>{const E=e.target.dataset.e,D=e.target.dataset.d;
 if(E){const c=cars.find(x=>x.id===E);eid=E;img=c.img||'';$('c_name').value=c.name||'';$('c_cat').value=c.category||'';$('c_price').value=c.price||'';$('c_spec').value=c.spec||'';$('c_desc').value=c.desc||'';$('c_order').value=c.order||0;$('c_pin').checked=!!c.pinned;$('c_img').value=img.startsWith('data:')?'':img;$('c_pv').src=img;$('c_pv').hidden=!img;$('c_h').textContent='Sửa xe';scrollTo(0,0)}
 if(D&&confirm('Xóa xe này?')){await deleteDoc(doc(db,'cars',D));loadC()}};
/* Đơn đặt */
const ST={new:'Mới',confirmed:'Đã xác nhận',done:'Hoàn thành',cancelled:'Đã hủy'};
const det=b=>b.type==='train'?`🚆 ${esc(b.from)} → ${esc(b.to)} × ${esc(b.qty)} vé<br><span class="mut">Đi: ${esc(b.date)}${b.back?' · Về: '+esc(b.back):''}</span>`
 :b.type==='room'?`🏨 ${esc(b.roomType)}${b.roomLoc?' · '+esc(b.roomLoc):''} × ${esc(b.qty)} phòng, ${esc(b.guests)} khách<br><span class="mut">Nhận: ${esc(b.in)} → Trả: ${esc(b.out)}</span>`
 :`🚗 ${esc(b.car)} × ${esc(b.qty)}<br><span class="mut">Tàu ra đảo: ${esc(b.pickup).replace('T',' ')} → Tàu rời đảo: ${esc(b.ret).replace('T',' ')}</span>`;
async function loadB(){const l=(await getDocs(query(collection(db,'bookings'),orderBy('createdAt','desc')))).docs;
 $('b_list').innerHTML=l.map(x=>{const b=x.data();return `<div class="box"><b>${esc(b.name)}</b> · <a href="tel:${esc(b.phone)}" style="color:var(--acc)">${esc(b.phone)}</a><br>
 ${det(b)}<br>${b.consent?'<small class="ok">✔ Đã đồng ý Chính sách bảo mật</small><br>':''}${b.note?`<i>${esc(b.note)}</i><br>`:''}
 <select data-s="${x.id}" style="width:auto">${Object.entries(ST).map(([k,v])=>`<option value="${k}" ${b.status===k?'selected':''}>${v}</option>`).join('')}</select>
 <button class="btn g" data-x="${x.id}">Xóa</button></div>`}).join('')||'<p class="mut">Chưa có đơn.</p>'}
$('b_list').onchange=e=>{if(e.target.dataset.s)updateDoc(doc(db,'bookings',e.target.dataset.s),{status:e.target.value})};
$('b_list').onclick=async e=>{if(e.target.dataset.x&&confirm('Xóa đơn này?')){await deleteDoc(doc(db,'bookings',e.target.dataset.x));loadB()}};
</script></body></html>
